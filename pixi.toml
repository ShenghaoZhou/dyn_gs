[workspace]
authors = ["Shenghao <shzhou@udel.edu>"]
channels = ["conda-forge", "https://repo.prefix.dev/3dgs"]
name = "dyn_gs"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]


[system-requirements]
cuda = "12"

[dependencies]
python = "3.12.*"
pytorch-gpu = "2.8.*"
open3d = ">=0.19.0,<0.20"
matplotlib = ">=3.10.8,<4"
tqdm = ">=4.67.3,<5"
plyfile = ">=1.1,<2"
cuda-compiler = ">=12.9.1,<13"
tensorboard = ">=2.20.0,<3"
torchvision = ">=0.24.0,<0.25"
numpy = "<2"
gcc = "11.*"
rerun-sdk = ">=0.30.2,<0.31"
scipy = ">=1.17.1,<2"
tyro = ">=1.0.11,<2"
trimesh = ">=4.11.5,<5"
evo = ">=1.34.3,<2"
opencv = ">=4.11"
pyceres = ">=2.6,<3"
pycolmap = ">=3.13.0,<4"
diff_gaussian_rasterization_on_the_fly_nvs = ">=0.0.1,<0.0.2"
diff_surfel_rasterization = ">=0.0.1,<0.0.2"
pytorch3d = ">=0.7.7,<0.8"
