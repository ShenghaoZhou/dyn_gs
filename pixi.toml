[workspace]
authors = ["Shenghao <shzhou@udel.edu>"]
channels = ["conda-forge", "https://repo.prefix.dev/3dgs"]
name = "dyn_gs"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]


[system-requirements]
cuda = "12"

[dependencies]
python = "3.12.*"
pytorch-gpu = "2.8.*"
open3d = ">=0.19.0,<0.20"
matplotlib = ">=3.10.8,<4"
tqdm = ">=4.67.3,<5"
plyfile = ">=1.1,<2"
cuda-compiler = ">=12.9.1,<13"
tensorboard = ">=2.20.0,<3"
torchvision = ">=0.24.0,<0.25"
numpy = "<2"
gcc = "10.*"
rerun-sdk = ">=0.30.2,<0.31"
scipy = ">=1.17.1,<2"
tyro = ">=1.0.11,<2"
trimesh = ">=4.11.5,<5"
evo = ">=1.34.3,<2"
pyceres = ">=2.6,<3"
pycolmap = ">=3.13.0,<4"
diff_gaussian_rasterization_on_the_fly_nvs = ">=0.0.2,<0.0.3"
diff_surfel_rasterization = ">=0.0.1,<0.0.2"
pytorch3d = ">=0.7.7,<0.8"
cuda-sanitizer-api = ">=12.9.79,<13"
ninja = ">=1.13.2,<2"
cxx-compiler = ">=1.5.1,<2"
theseus-ai = ">=0.2.3,<0.3"
huggingface_hub = ">=0.29.1,<1"
einops = ">=0.8.0,<1"
timm = ">=1.0.15,<2"
jaxtyping = ">=0.2.38,<1"
scikit-learn = ">=1.6.1,<2"
pyyaml = ">=6.0.2,<7"
xformers = ">=0.0.32.post2,<0.0.33"
cmake = ">=3.20,<4"
hydra-core = ">=1.3.6,<2"



[pypi-options]
no-build-isolation = ["gsplat"]

[pypi-dependencies]
gsplat = { path = "./gsplat" }
poselib = { path = "./PoseLib" }

uniflowmatch = { path = "./third_party/UFM", editable = true }
uniception = { path = "./third_party/UFM/UniCeption", editable = true }
flow_vis = "*"
minio = "*"
torchmetrics = "*"
termcolor = "*"
gradio = "*"
kornia = { git = "https://github.com/kornia/kornia.git" }
opencv-python-headless = ">=4.11.0.86, <5"
